<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperatura en Roma</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap');
        
        body {
            font-family: 'Playfair Display', serif;
            background-image: url('https://denomades.s3.us-west-2.amazonaws.com/blog/wp-content/uploads/2024/03/21064745/italia-roma.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
        }
        
        .temperature-card {
            backdrop-filter: blur(10px);
            background: rgba(220, 220, 220, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            border-radius: 20px;
            border: 5px solid rgba(255, 255, 255, 0.2);
        }
        
        .hour-item {
            transition: all 0.3s ease;
        }
        
        .hour-item:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.4);
        }
        
        .sun-animation {
            animation: pulse 4s infinite alternate;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">
    <div class="temperature-card w-full max-w-4xl p-8">
        <!-- Header -->
        <div class="flex flex-col items-center mb-12">
            <div class="sun-animation text-amber-400 text-5xl mb-4">
                <i class="fas fa-sun"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800">Roma</h1>
            <p class="text-gray-600 italic">Las próximas 12 horas</p>
        </div>
        
        <!-- Temperature Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <div th:each="i : ${#numbers.sequence(0, 11)}" class="hour-item bg-white/30 p-4 rounded-xl flex flex-col items-center">
                <span th:text="${times[i]}" class="text-gray-600">13:00</span>
                <span th:text="${temperature[i]} + 'º'" class="text-4xl font-bold text-gray-800 mt-2">25°</span>
                <div class="text-yellow-500 mt-2">
                    <i class="fas fa-sun"></i>
                </div>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="mt-12 text-center text-gray-500 text-sm">
            <p>Actualizado: <span id="current-time">12:00</span></p>
        </div>
    </div>

    <script>
        // Actualizar la hora actual
        function updateCurrentTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.getElementById('current-time').textContent = `${hours}:${minutes}`;
        }
        
        updateCurrentTime();
        setInterval(updateCurrentTime, 60000);
        
        // Efecto de carga inicial
        document.addEventListener('DOMContentLoaded', () => {
            const hourItems = document.querySelectorAll('.hour-item');
            hourItems.forEach((item, index) => {
                setTimeout(() => {
                    item.style.opacity = '1';
                    item.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
    </script>
</body>
</html>
